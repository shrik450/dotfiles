[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mdformat-displaywrap"
version = "0.1.1"
description = "Wrap Markdown by the width a reader sees, counting a link as its link text"
requires-python = ">=3.9"
dependencies = ["mdformat>=0.7.17"]

[project.entry-points."mdformat.parser_extension"]
displaywrap = "mdformat_displaywrap"
